name: Release

# A `v*` tag builds the `obmem` binary for every platform, publishes it to npm and attaches the
# binaries to a GitHub release. npm gets one package per platform plus `obmem`, which runs the
# one that fits the machine (see npm/build.mjs).
# Run it by hand to check that every platform still builds: without a tag nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Static musl binaries run on any Linux, whatever its libc. They are built with `cross`:
          # aws-lc-sys needs the kernel headers, which Ubuntu's `musl-gcc` does not have.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        env:
          # The Windows runner has no NASM: aws-lc-sys then uses the assembly it ships prebuilt.
          AWS_LC_SYS_PREBUILT_NASM: "1"
          # No Visual C++ runtime to install next to the Windows binary.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --profile dist --locked -p obmem --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: obmem-${{ matrix.target }}
          path: target/${{ matrix.target }}/dist/obmem${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # the GitHub release
      contents: write
      # npm provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: binaries
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assemble the npm packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}" binaries dist > packages.txt
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          while read -r folder; do
            npm publish "$folder" --access public --provenance
          done < packages.txt
      - name: Attach the binaries to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for folder in binaries/obmem-*; do
            target=${folder#binaries/obmem-}
            chmod +x "$folder"/obmem*
            case "$target" in
              *windows*) (cd "$folder" && zip -q "$GITHUB_WORKSPACE/assets/obmem-$target.zip" obmem.exe) ;;
              *) tar -C "$folder" -czf "assets/obmem-$target.tar.gz" obmem ;;
            esac
          done
          gh release create "$GITHUB_REF_NAME" assets/* --generate-notes --verify-tag
