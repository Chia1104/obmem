[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# The GUI pulls in Native Shell and the platform toolkits: build it with `-p obmem-gui` or `nsh`.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Chia1104/obmem"

# No debug info for dependencies in dev builds: it is most of each rlib's size (a Native Shell
# rlib is hundreds of MB with it) and of link time. Workspace crates keep full debug info.
[profile.dev.package."*"]
debug = false

[workspace.dependencies]
obmem-core = { path = "crates/obmem-core" }
obmem-mcp = { path = "crates/obmem-mcp" }
obmem-agents = { path = "crates/obmem-agents" }
obmem-sync = { path = "crates/obmem-sync" }

# Native Shell (apps/obmem-gui). The nsh CLI builds against its own version of these crates, so
# upgrade the CLI and these together.
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-engine = "0.4.0"
nsh-testing = "0.4.0"
nsh-platform-macos = { version = "0.4.0", default-features = false }
nsh-platform-windows = { version = "0.4.0", default-features = false }

aho-corasick = "1.1.5"
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11"
hex = "0.4.3"
percent-encoding = "2.3.2"
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
yaml_serde = "0.10.7"
