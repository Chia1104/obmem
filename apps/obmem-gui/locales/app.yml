# The desktop app's words: every text the user reads, in English (`en`) and Traditional Chinese
# (`zh`). rust-i18n's format, one file for both languages. `%{name}` is filled in by the code.
#
# Chinese is under `zh`, not `zh-Hant` or `zh-TW`, so that every Chinese a computer may name
# finds it (see `Language::locale` in src/appearance.rs).
#
# A key names what the text is for, not the English text. A whole sentence is one key.
# A test in src/words.rs checks that every key the code uses is here, in both languages.
