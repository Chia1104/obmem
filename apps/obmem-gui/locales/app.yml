    zh: "同步"
  about:
    en: "Keep this personal vault the same on your Macs and PCs through an S3-compatible bucket you own: AWS S3, Cloudflare R2 or MinIO. Everything in the bucket is encrypted, and only your passphrase unlocks it."
    zh: "透過你自己的 S3 相容儲存貯體（AWS S3、Cloudflare R2 或 MinIO），讓個人儲存庫在你的 Mac 與 PC 上保持一致。儲存貯體中的內容全部加密，只有你的通關密語能解開。"
  settings:
    en: "Sync settings"
    zh: "同步設定"
  unreadable:
    en: "Could not read the sync settings"
    zh: "無法讀取同步設定"
  off:
    en: "Off: no bucket yet."
    zh: "未啟用：還沒有儲存貯體。"
  keychain_unreadable:
    en: "Could not read the keychain"
    zh: "無法讀取鑰匙圈"
  not_connected:
    en: "This device is not connected"
    zh: "這部裝置尚未連接"
  not_connected_about:
    en: "Connect it with the bucket's access key and your passphrase."
    zh: "用儲存貯體的存取金鑰與你的通關密語來連接。"
  not_synced:
    en: "Connected, not synced yet"
    zh: "已連接，尚未同步"
  not_synced_about:
    en: "Sync now, or start an agent session in an obmem project."
    zh: "立即同步，或在 obmem 專案中開始代理程式的工作階段。"
  last:
    en: "Last sync"
    zh: "上次同步"
  last_failed:
    en: "The last sync failed"
    zh: "上次同步失敗"
  last_about:
    en: "%{what} (%{at})"
    zh: "%{what}（%{at}）"
  now:
    en: "Sync now"
    zh: "立即同步"
  endpoint:
    en: "Endpoint"
    zh: "端點"
  endpoint_help:
    en: "The S3 API URL, e.g. https://<account-id>.r2.cloudflarestorage.com. Empty: AWS S3."
    zh: "S3 API 的網址，例如 https://<account-id>.r2.cloudflarestorage.com。留空：AWS S3。"
  bucket:
    en: "Bucket"
    zh: "儲存貯體"
  bucket_help:
    en: "Empty turns sync off."
    zh: "留空會關閉同步。"
  region:
    en: "Region"
    zh: "區域"
  region_help:
    en: "AWS needs the bucket's region. Empty: auto, which R2 expects."
    zh: "AWS 需要儲存貯體的區域。留空：auto，R2 要的就是這個。"
  prefix:
    en: "Prefix"
    zh: "前置路徑"
  prefix_help:
    en: "Where in the bucket the vault goes. Empty: obmem."
    zh: "儲存庫放在儲存貯體中的哪裡。留空：obmem。"
  device:
    en: "This device's name"
    zh: "這部裝置的名稱"
  device_help:
    en: "Shown in snapshots and conflict copies, and part of session log names. Connecting sets it to the host name plus four random hex digits, so two machines never share one."
    zh: "會出現在快照與衝突副本中，也是工作階段紀錄檔名的一部分。連接時會設為主機名稱加四個隨機十六進位數字，所以兩部機器不會同名。"
  auto:
    en: "Sync automatically"
    zh: "自動同步"
  auto_help:
    en: "Sync in the background when an agent session starts or a turn ends in an obmem project, at most once a minute."
    zh: "在 obmem 專案中，代理程式的工作階段開始或一輪對話結束時於背景同步，最多每分鐘一次。"
  plugins:
    en: "Community plugins"
    zh: "社群外掛"
  plugins_help:
    en: "Also sync .obsidian/plugins. Settings, themes and snippets always sync; the workspace layout never does."
    zh: "也同步 .obsidian/plugins。設定、佈景主題與程式碼片段一律同步；工作區版面則永不同步。"
  plugins_switch:
    en: "Sync community plugins"
    zh: "同步社群外掛"
  connect_title:
    en: "Connect this device"
    zh: "連接這部裝置"
  connect_about:
    en: "The access key stays in this device's keychain. On the first device the passphrase you choose starts the vault; every other device unlocks it with the same one. If you forget it, the bucket cannot be read."
    zh: "存取金鑰只留在這部裝置的鑰匙圈中。在第一部裝置上，你選的通關密語會建立儲存庫；其他裝置都用同一組通關密語解鎖。忘記的話，儲存貯體的內容就無法讀取。"
  key_id:
    en: "Access key ID"
    zh: "存取金鑰 ID"
  secret:
    en: "Secret access key"
    zh: "私密存取金鑰"
  passphrase:
    en: "Passphrase"
    zh: "通關密語"
  repeat:
    en: "Repeat passphrase"
    zh: "再次輸入通關密語"
  connect:
    en: "Connect"
    zh: "連接"
  saved:
    en: "Sync settings saved."
    zh: "同步設定已儲存。"
  started_vault:
    en: "Started a new encrypted vault in %{bucket}. Every other device unlocks it with the same passphrase."
    zh: "已在 %{bucket} 建立新的加密儲存庫。其他裝置都用同一組通關密語解鎖。"
  connected_to:
    en: "Connected to the vault in %{bucket}."
    zh: "已連接到 %{bucket} 中的儲存庫。"
  synced:
    en: "Synced: %{summary}"
    zh: "已同步：%{summary}"
  queued:
    en: "A sync is already queued."
    zh: "已經有一次同步在排隊。"
  summary:
    nothing:
      en: "nothing to sync yet"
      zh: "還沒有可同步的內容"
    snapshot:
      en: "snapshot %{seq}"
      zh: "快照 %{seq}"
    up_to_date:
      en: "up to date with snapshot %{seq}"
      zh: "與快照 %{seq} 一致"
    with_parts:
      en: "%{head}: %{parts}"
      zh: "%{head}：%{parts}"
    up:
      en: "%{n} up"
      zh: "上傳 %{n} 個"
    down:
      en: "%{n} down"
      zh: "下載 %{n} 個"
    conflict:
      en: "%{n} conflict"
      zh: "衝突 %{n} 個"
    conflicts:
      en: "%{n} conflicts"
      zh: "衝突 %{n} 個"
    deferred:
      en: "%{n} left for the next sync"
      zh: "%{n} 個留待下次同步"
    skipped:
      en: "%{n} skipped"
      zh: "略過 %{n} 個"
  cleanup:
    removed:
      en: "%{summary}; removed %{snapshots} old snapshots and %{blobs} unused blobs"
      zh: "%{summary}；已移除 %{snapshots} 個舊快照與 %{blobs} 個不再使用的 blob"
    failed:
      en: "%{summary}; cleaning up old snapshots failed: %{why}"
      zh: "%{summary}；清理舊快照失敗：%{why}"

allowlist:
  title:
    en: "Allowed everywhere"
    zh: "在所有專案中允許"
  about:
    en: "False positives the scanner lets through in every project. Only this list may hold patterns and words."
    zh: "掃描器在所有專案中都會放行的誤判。只有這份清單可以包含樣式與字詞。"
  unreadable:
    en: "Could not read your allowlist"
    zh: "無法讀取你的允許清單"
  fingerprints:
    en: "Fingerprints"
    zh: "指紋"
  fingerprints_help:
    en: "Exact values, added from a scan."
    zh: "完全相符的值，從掃描結果加入。"
  patterns:
    en: "Patterns"
    zh: "樣式"
  patterns_help:
    en: "Regexes matched against a suspected secret."
    zh: "用來比對疑似機密的正規表示式。"
  words:
    en: "Words"
    zh: "字詞"
  words_help:
    en: "A value containing one of these (4+ letters) is not a secret."
    zh: "含有其中任一字詞（至少 4 個字母）的值不算機密。"
  add_patterns:
    en: "Add to patterns"
    zh: "加入樣式"
  add_words:
    en: "Add to words"
    zh: "加入字詞"
  none:
    en: "None."
    zh: "無。"
  allowed_here:
    en: "Allowed in this project."
    zh: "已在這個專案中允許。"
  allowed_everywhere:
    en: "Allowed in every project."
    zh: "已在所有專案中允許。"
  removed:
    en: "Removed from the allowlist."
    zh: "已從允許清單移除。"

ignored:
  empty:
    en: "The scanner would ignore \"%{entry}\": it is empty."
    zh: "掃描器會忽略「%{entry}」：它是空的。"
  matches_anything:
    en: "The scanner would ignore \"%{entry}\": it matches almost anything."
    zh: "掃描器會忽略「%{entry}」：它幾乎符合任何內容。"
  invalid_regex:
    en: "The scanner would ignore \"%{entry}\": it is not a valid regex: %{why}."
    zh: "掃描器會忽略「%{entry}」：它不是有效的正規表示式：%{why}。"
  too_short:
    en: "The scanner would ignore \"%{entry}\": it is shorter than %{min} characters."
    zh: "掃描器會忽略「%{entry}」：它少於 %{min} 個字元。"
  too_generic:
    en: "The scanner would ignore \"%{entry}\": it is too generic."
    zh: "掃描器會忽略「%{entry}」：它太常見了。"

rule:
  vault_inside_project:
    en: "The vault must be a relative path inside the project, without `..` or `~`."
    zh: "儲存庫必須是專案內的相對路徑，不能含有 `..` 或 `~`。"
  env_file_inside_project:
    en: "The env file \"%{file}\" must be a relative path inside the project."
    zh: "env 檔案「%{file}」必須是專案內的相對路徑。"
  stale_days_at_least_one:
    en: "Stale days must be at least 1."
    zh: "過期天數至少要是 1。"
  stale_days_whole:
    en: "Stale days must be a whole number."
    zh: "過期天數必須是整數。"
  duplicate_threshold_in_range:
    en: "The duplicate threshold must be above 0 and at most 1."
    zh: "重複門檻必須大於 0，且不超過 1。"
  duplicate_threshold_number:
    en: "The duplicate threshold must be a number such as 0.75."
    zh: "重複門檻必須是數字，例如 0.75。"
  personal_vault_absolute:
    en: "The personal vault must be an absolute path or start with ~/."
    zh: "個人儲存庫必須是絕對路徑，或以 ~/ 開頭。"
  endpoint_is_url:
    en: "The endpoint must be a URL starting with https://."
    zh: "端點必須是以 https:// 開頭的網址。"
  bucket_is_name:
    en: "The bucket is a name, without slashes or spaces."
    zh: "儲存貯體是一個名稱，不能含有斜線或空格。"
  key_id_needed:
    en: "Enter the bucket's access key ID."
    zh: "請輸入儲存貯體的存取金鑰 ID。"
  secret_needed:
    en: "Enter the bucket's secret access key."
    zh: "請輸入儲存貯體的私密存取金鑰。"
  passphrase_needed:
    en: "Enter a passphrase."
    zh: "請輸入通關密語。"
  passphrases_differ:
    en: "The passphrases differ."
    zh: "兩次輸入的通關密語不同。"

appearance:
  mode:
    en: "Mode"
    zh: "模式"
  mode_about:
    en: "System follows the computer's appearance."
    zh: "「跟隨系統」會使用電腦的外觀。"
  system:
    en: "System"
    zh: "跟隨系統"
  light:
    en: "Light"
    zh: "淺色"
  dark:
    en: "Dark"
    zh: "深色"
  light_theme:
    en: "Light theme"
    zh: "淺色佈景主題"
  light_theme_about:
    en: "What the window shows in the light appearance."
    zh: "視窗在淺色外觀下顯示的佈景主題。"
  dark_theme:
    en: "Dark theme"
    zh: "深色佈景主題"
  dark_theme_about:
    en: "What the window shows in the dark appearance."
    zh: "視窗在深色外觀下顯示的佈景主題。"
  theme_gone:
    en: "The theme %{theme} cannot be shown"
    zh: "無法顯示佈景主題 %{theme}"
  theme_gone_about:
    en: "Its file is gone or cannot be read. The default theme shows instead."
    zh: "它的檔案不見了或無法讀取，所以改為顯示預設的佈景主題。"
  duplicate:
    en: "Duplicate"
    zh: "製作副本"
  duplicate_about:
    en: "Duplicate saves a copy of the theme shown in your themes folder, for you to edit."
    zh: "「製作副本」會把目前顯示的佈景主題存一份到你的佈景主題資料夾，讓你編輯。"
  duplicated:
    en: "Saved as %{copy}.json in your themes folder. Edit it and come back."
    zh: "已在你的佈景主題資料夾存為 %{copy}.json。編輯後回到這裡即可。"
  own:
    en: "Your themes"
    zh: "你的佈景主題"
  own_about:
    en: "A theme is a JSON file of shadcn/ui colors, as tweakcn.com exports them. Duplicate one where you pick a theme or put a file in your themes folder, then edit it in any editor: it shows here when you come back to this window."
    zh: "佈景主題是一個 shadcn/ui 顏色的 JSON 檔案，格式與 tweakcn.com 匯出的相同。在選擇佈景主題的地方製作副本，或把檔案放進你的佈景主題資料夾，再用任何編輯器修改：回到這個視窗時就會顯示在這裡。"
  open_folder:
    en: "Open themes folder"
    zh: "打開佈景主題資料夾"
  own_none:
    en: "None yet."
    zh: "還沒有。"
  left_out:
    en: "%{file}. Left out: %{what}."
    zh: "%{file}。未採用：%{what}。"
  show_file:
    en: "Show file"
    zh: "顯示檔案"

language:
  title:
    en: "Language"
    zh: "語言"
  about:
    en: "System follows the computer's language: Chinese or English, and English for any other."
    zh: "「跟隨系統」會使用電腦的語言：中文或英文；其他語言則顯示英文。"
  system:
    en: "System"
    zh: "跟隨系統"
  # A language is named in itself, in both languages, so that its speakers find it.
  english:
    en: "English"
    zh: "English"
  chinese:
    en: "繁體中文"
    zh: "繁體中文"

toast:
  failed:
    en: "That did not work"
    zh: "操作沒有成功"
