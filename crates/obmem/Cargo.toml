[package]
name = "obmem"
description = "Obsidian-backed long-term memory for coding agents (MCP server + CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
obmem-core = { workspace = true, features = ["clap"] }
obmem-mcp.workspace = true
obmem-agents = { workspace = true, features = ["clap"] }
obmem-sync.workspace = true
obmem-update.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rpassword = "7.5.4"
serde_json.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }
