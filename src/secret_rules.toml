# Built-in secret rules (gitleaks-compatible format).
#
# This list is intentionally short: it only covers token formats with a fixed, documented
# prefix, which gives near-zero false positives. Everything else is caught by
#   1. the generic "sensitive key = high-entropy value" rule below, and
#   2. exact matching of your *real* secret values (from .env files / env vars),
# so you do not have to keep growing a hard-coded list.
#
# To extend: drop a full gitleaks.toml (https://github.com/gitleaks/gitleaks) or your own
# rules at <vault>/_system/secret-rules.toml — same schema, merged with these.

[[rules]]
id = "private-key"
description = "PEM private key block"
regex = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "aws-access-key-id"
description = "AWS access key id"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
keywords = ["akia", "asia", "abia", "acca", "a3t"]

[[rules]]
id = "github-token"
description = "GitHub classic / OAuth / app token"
regex = '''\b((?:ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{36})\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "github-fine-grained-pat"
description = "GitHub fine-grained personal access token"
regex = '''\b(github_pat_[0-9A-Za-z_]{82})\b'''
keywords = ["github_pat_"]

[[rules]]
id = "gitlab-pat"
description = "GitLab personal access token"
regex = '''\b(glpat-[0-9A-Za-z_\-]{20,})\b'''
keywords = ["glpat-"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\b(sk-ant-[a-z0-9]+-[A-Za-z0-9_\-]{32,})'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{40,}|sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-", "t3blbkfj"]

[[rules]]
id = "slack-token"
description = "Slack bot / user / app token"
regex = '''\b(xox[abposr]-[0-9A-Za-z\-]{10,})'''
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxo-", "xoxs-", "xoxr-"]

[[rules]]
id = "slack-webhook"
description = "Slack incoming webhook URL"
regex = '''(https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]{20,})'''
keywords = ["hooks.slack.com"]

[[rules]]
id = "stripe-key"
description = "Stripe secret / restricted key"
regex = '''\b((?:sk|rk)_(?:live|test)_[0-9A-Za-z]{20,})\b'''
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\b(AIza[0-9A-Za-z_\-]{35})\b'''
keywords = ["aiza"]

[[rules]]
id = "npm-token"
description = "npm access token"
regex = '''\b(npm_[0-9A-Za-z]{36})\b'''
keywords = ["npm_"]

[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '''\b(eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,})'''
keywords = ["eyj"]

[[rules]]
id = "url-credentials"
description = "Password embedded in a connection URL (postgres://user:pass@host)"
regex = '''[a-zA-Z][a-zA-Z0-9+.\-]*://[^\s:/@]+:([^\s:/@]{6,})@'''
keywords = ["://"]
entropy = 2.5

[[rules]]
id = "generic-assignment"
description = "Sensitive-looking key assigned a high-entropy value"
regex = '''(?i)(?:api[_\-]?key|secret|token|passw(?:or)?d|pwd|credential|auth[_\-]?key|private[_\-]?key|access[_\-]?key|client[_\-]?secret)[\w.\-]{0,20}["']?\s*[:=]\s*["'`]?([A-Za-z0-9_\-+/=.~]{12,})'''
keywords = ["key", "secret", "token", "pass", "pwd", "credential"]
entropy = 3.5
